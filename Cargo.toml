[package]
name = "gpui-command-palette"
publish = false
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Native and WebAssembly command palette for Zed GPUI"
license = "MIT"
repository = "https://github.com/ignition-is-go/gpui-command-palette"
keywords = ["gpui", "command-palette", "wasm", "ui"]
categories = ["gui"]

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git" }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", features = ["wayland", "x11"] }

[target.'cfg(target_family = "wasm")'.dependencies]
web-sys = { version = "0.3", features = ["Navigator", "Window"] }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git", features = ["test-support"] }

[[example]]
name = "demo"
path = "examples/demo.rs"
