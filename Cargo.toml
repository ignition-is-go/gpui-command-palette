[package]
name = "gpui-command-palette"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Native and WebAssembly command palette for Zed GPUI"
license = "MIT"
repository = "https://github.com/ignition-is-go/gpui-command-palette"
keywords = ["gpui", "command-palette", "wasm", "ui"]
categories = ["gui"]

[package.metadata.flux]
tasks = ["build", "publish"]

[dependencies]
gpui = { package = "gpui-unofficial", version = "=1.16.1" }
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "=1.16.1", features = ["wayland", "x11"] }

[target.'cfg(target_family = "wasm")'.dependencies]
web-sys = { version = "0.3", features = ["Navigator", "Window"] }

[dev-dependencies]
gpui = { package = "gpui-unofficial", version = "=1.16.1", features = ["test-support"] }

[[example]]
name = "demo"
path = "examples/demo.rs"
