[workspace]
[package]
name = "gpui-command-palette-web-demo"
version = "0.1.0"
edition = "2021"
publish = false
[[bin]]
name = "gpui-command-palette-web-demo"
path = "main.rs"
[dependencies]
gpui-command-palette = { path = "../.." }
gpui = { package = "gpui-unofficial", version = "=1.16.1" }
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "=1.16.1" }
web-sys = { version = "0.3", features = ["Window"] }
